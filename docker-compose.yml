services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: tibro
      POSTGRES_USER: tibro
      POSTGRES_PASSWORD: tibro
    volumes:
      - tibro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tibro -d tibro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tibro-postgres:
